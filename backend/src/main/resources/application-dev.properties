# ==================== SERVER ====================
server.port=8080

# ==================== DATABASE ====================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET:MyVerySecretKeyForDevelopmentOnlyNeverUseInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==================== CORS ====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==================== LOGGING ====================
logging.level.com.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG

# ==================== OPENAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
